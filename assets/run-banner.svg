<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="A pixel character running and jumping through a retro obstacle course">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="45%" stop-color="#54246f"/>
      <stop offset="78%" stop-color="#b5406a"/>
      <stop offset="100%" stop-color="#f0803c"/>
    </linearGradient>
    <pattern id="dirt" width="30" height="50" patternUnits="userSpaceOnUse">
      <rect width="30" height="50" fill="#2d1b47"/>
      <rect width="30" height="4" fill="#7ee787" opacity="0.9"/>
      <rect y="4" width="30" height="3" fill="#3d8f52"/>
      <rect x="26" y="7" width="2" height="43" fill="#241539"/>
      <rect x="0" y="28" width="30" height="2" fill="#241539"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="250" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="Courier New,Courier,monospace">
    <rect width="900" height="250" fill="url(#sky)"/>

    <!-- retro banded sun, fixed -->
    <g>
      <circle cx="700" cy="158" r="74" fill="#ffd166" opacity="0.95"/>
      <rect x="620" y="120" width="160" height="5" fill="#54246f" opacity="0.75"/>
      <rect x="620" y="136" width="160" height="6" fill="#7a2f6c" opacity="0.75"/>
      <rect x="620" y="154" width="160" height="7" fill="#a03a6a" opacity="0.75"/>
      <rect x="620" y="174" width="160" height="9" fill="#b5406a" opacity="0.8"/>
      <rect x="620" y="196" width="160" height="12" fill="#c9556c" opacity="0.85"/>
    </g>

    <!-- clouds, slowest layer -->
    <g opacity="0.35">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="60s" repeatCount="indefinite"/>
      <g fill="#ffd9e8">
        <rect x="120" y="62" width="70" height="10"/><rect x="136" y="52" width="40" height="10"/>
        <rect x="520" y="88" width="56" height="9"/><rect x="534" y="79" width="30" height="9"/>
        <rect x="1020" y="62" width="70" height="10"/><rect x="1036" y="52" width="40" height="10"/>
        <rect x="1420" y="88" width="56" height="9"/><rect x="1434" y="79" width="30" height="9"/>
      </g>
    </g>

    <!-- far hills -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="40s" repeatCount="indefinite"/>
      <polygon fill="#2a1a4a" points="0,196 150,140 300,196 450,128 600,196 750,150 900,196 1050,140 1200,196 1350,128 1500,196 1650,150 1800,196 1800,250 0,250"/>
    </g>

    <!-- near hills -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="22s" repeatCount="indefinite"/>
      <polygon fill="#1c1033" points="0,204 110,168 220,204 340,158 460,204 600,176 740,204 900,204 1010,168 1120,204 1240,158 1360,204 1500,176 1640,204 1800,204 1800,250 0,250"/>
    </g>

    <!-- ground + obstacles, fastest layer: 150 px/s -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="6s" repeatCount="indefinite"/>
      <rect x="0" y="200" width="1800" height="50" fill="url(#dirt)"/>

      <!-- crates at 225 / 1125 -->
      <g fill="#a0653a" stroke="#5e3620" stroke-width="2">
        <rect x="225" y="174" width="26" height="26"/><rect x="1125" y="174" width="26" height="26"/>
      </g>
      <g stroke="#5e3620" stroke-width="2">
        <line x1="225" y1="174" x2="251" y2="200"/><line x1="251" y1="174" x2="225" y2="200"/>
        <line x1="1125" y1="174" x2="1151" y2="200"/><line x1="1151" y1="174" x2="1125" y2="200"/>
      </g>
      <!-- spikes at 675 / 1575 -->
      <g fill="#c9d1d9" stroke="#6e7681" stroke-width="1.5">
        <polygon points="663,200 673,176 683,200"/><polygon points="681,200 691,180 701,200"/>
        <polygon points="1563,200 1573,176 1583,200"/><polygon points="1581,200 1591,180 1601,200"/>
      </g>

      <!-- spinning coins -->
      <g fill="#ffd166" stroke="#c9922e" stroke-width="2">
        <ellipse cx="450" cy="146" rx="9" ry="9"><animate attributeName="rx" values="9;2;9" dur="1.1s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="900" cy="146" rx="9" ry="9"><animate attributeName="rx" values="9;2;9" dur="1.1s" begin="0.35s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="1350" cy="146" rx="9" ry="9"><animate attributeName="rx" values="9;2;9" dur="1.1s" begin="0.7s" repeatCount="indefinite"/></ellipse>
      </g>
    </g>

    <!-- the runner: fixed at x=180, jumps every 3s to clear each obstacle -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -60; 0 0; 0 0" keyTimes="0; 0.1; 0.2; 1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.15 0.6 0.4 1; 0.6 0 0.85 0.45; 0 0 1 1"/>

      <ellipse cx="181" cy="202" rx="19" ry="4" fill="#0d0718" opacity="0.45"/>

      <!-- arms, two-frame swing -->
      <g fill="#58a6ff">
        <rect x="158" y="172" width="12" height="7"/>
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="0.26s" repeatCount="indefinite"/>
      </g>
      <g fill="#58a6ff">
        <rect x="192" y="168" width="12" height="7"/>
        <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="0.26s" repeatCount="indefinite"/>
      </g>

      <!-- torso and head -->
      <rect x="167" y="170" width="28" height="18" fill="#3d8bfd"/>
      <rect x="167" y="184" width="28" height="4" fill="#0d0718"/>
      <rect x="170" y="152" width="22" height="19" fill="#ffcf9e"/>
      <rect x="167" y="146" width="28" height="7" fill="#f85149"/>
      <rect x="190" y="153" width="11" height="4" fill="#f85149"/>
      <rect x="185" y="159" width="4" height="5" fill="#0d0718"/>

      <!-- legs frame A, stride open -->
      <g>
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="0.26s" repeatCount="indefinite"/>
        <rect x="166" y="188" width="10" height="12" fill="#2f2a4a"/>
        <rect x="186" y="188" width="10" height="12" fill="#2f2a4a"/>
        <rect x="163" y="196" width="14" height="5" fill="#0d0718"/>
        <rect x="186" y="196" width="14" height="5" fill="#0d0718"/>
      </g>
      <!-- legs frame B, stride closed -->
      <g>
        <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="0.26s" repeatCount="indefinite"/>
        <rect x="172" y="188" width="10" height="12" fill="#2f2a4a"/>
        <rect x="181" y="190" width="10" height="10" fill="#2f2a4a"/>
        <rect x="170" y="196" width="14" height="5" fill="#0d0718"/>
        <rect x="181" y="195" width="14" height="5" fill="#0d0718"/>
      </g>
    </g>

    <!-- HUD -->
    <text x="28" y="40" fill="#ffd166" font-size="13" letter-spacing="2">SCORE 001204</text>
    <text x="28" y="60" fill="#7ee787" font-size="11" letter-spacing="2">LIFE  ● ● ●</text>
    <text x="450" y="46" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="bold" letter-spacing="10">D A N A</text>
    <text x="450" y="68" text-anchor="middle" fill="#ffd9e8" font-size="11" letter-spacing="4" opacity="0.85">STAGE 1-1  ·  FULL-STACK DEV</text>
    <text x="872" y="40" text-anchor="end" fill="#ffffff" font-size="12" letter-spacing="1" opacity="0.9">TIME 0:47</text>

    <rect width="900" height="250" fill="url(#scan)"/>
    <rect x="1.5" y="1.5" width="897" height="247" fill="none" stroke="#e6edf3" stroke-width="3" opacity="0.9" rx="4"/>
  </g>
</svg>
