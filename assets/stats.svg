<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" aria-label="Dana - Level 5 full-stack developer character sheet">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="seg" width="10" height="16" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="2" height="16" fill="#0d1117"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="760" height="452" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="Courier New,Courier,monospace">
    <rect width="760" height="452" fill="url(#box)"/>

    <!-- frame matches the banner's, so the two boxes read as one game -->
    <rect x="5.5" y="5.5" width="749" height="441" fill="none" stroke="#e6edf3" stroke-width="3" opacity="0.9"/>
    <rect x="13.5" y="13.5" width="733" height="425" fill="none" stroke="#c9d1d9" stroke-width="1" opacity="0.4"/>

    <!-- ============ header ============ -->
    <text x="34" y="66" fill="#ffffff" font-size="30" font-weight="bold" letter-spacing="6">DANA</text>
    <text x="34" y="88" fill="#c9d1d9" font-size="12" letter-spacing="2" opacity="0.85">Lv.5  FULL-STACK DEV</text>
    <text x="726" y="60" fill="#8b949e" font-size="11" letter-spacing="1" text-anchor="end">STATUS</text>
    <text x="726" y="80" fill="#3fb950" font-size="13" letter-spacing="1" text-anchor="end">&#x25CF; LEVEL UP
      <animate attributeName="opacity" values="1;1;1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <line x1="34" y1="104" x2="726" y2="104" stroke="#c9d1d9" stroke-width="1" opacity="0.25"/>

    <!-- ============ stat bars ============ -->
    <text x="34" y="140" fill="#c9d1d9" font-size="12" letter-spacing="1" opacity="0.85">HP</text>
    <rect x="132" y="128" width="300" height="16" fill="#161b22"/>
    <rect x="132" y="128" height="16" fill="#f85149">
      <animate attributeName="width" from="0" to="180" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </rect>
    <rect x="132" y="128" width="300" height="16" fill="url(#seg)"/>
    <rect x="132" y="128" width="300" height="16" fill="none" stroke="#30363d"/>
    <text x="446" y="140" fill="#ffffff" font-size="12">60/100</text>
    <text x="530" y="140" fill="#8b949e" font-size="11">fueled by caffeine &amp; clean builds</text>

    <text x="34" y="172" fill="#c9d1d9" font-size="12" letter-spacing="1" opacity="0.85">XP</text>
    <rect x="132" y="160" width="300" height="16" fill="#161b22"/>
    <rect x="132" y="160" height="16" fill="#58a6ff">
      <animate attributeName="width" from="0" to="255" dur="1.1s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </rect>
    <rect x="132" y="160" width="300" height="16" fill="url(#seg)"/>
    <rect x="132" y="160" width="300" height="16" fill="none" stroke="#30363d"/>
    <text x="446" y="172" fill="#ffffff" font-size="12">85%</text>
    <text x="530" y="172" fill="#8b949e" font-size="11">next level: graduation</text>

    <text x="34" y="204" fill="#c9d1d9" font-size="12" letter-spacing="1" opacity="0.85">COFFEE</text>
    <rect x="132" y="192" width="300" height="16" fill="#161b22"/>
    <rect x="132" y="192" height="16" fill="#d29922">
      <animate attributeName="width" from="0" to="300" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </rect>
    <rect x="132" y="192" width="300" height="16" fill="url(#seg)"/>
    <rect x="132" y="192" width="300" height="16" fill="none" stroke="#30363d"/>
    <text x="446" y="204" fill="#d29922" font-size="12">MAX</text>
    <text x="530" y="204" fill="#8b949e" font-size="11">dangerously overcharged</text>

    <line x1="34" y1="230" x2="726" y2="230" stroke="#c9d1d9" stroke-width="1" opacity="0.25"/>

    <!-- ============ equipped ============ -->
    <text x="34" y="260" fill="#ffffff" font-size="12" font-weight="bold" letter-spacing="3">EQUIPPED</text>
    <text x="34" y="288" fill="#c9d1d9" font-size="13">&#x25C6; React 19</text>
    <text x="34" y="312" fill="#c9d1d9" font-size="13">&#x25C6; React Native</text>
    <text x="34" y="336" fill="#c9d1d9" font-size="13">&#x25C6; Firestore</text>
    <text x="196" y="288" fill="#c9d1d9" font-size="13">&#x25C6; Python / Flask</text>
    <text x="196" y="312" fill="#c9d1d9" font-size="13">&#x25C6; Gemini AI</text>
    <text x="196" y="336" fill="#8b949e" font-size="13">&#x25C7; sleep schedule</text>

    <line x1="376" y1="244" x2="376" y2="352" stroke="#c9d1d9" stroke-width="1" opacity="0.2"/>

    <!-- ============ quest ============ -->
    <text x="410" y="260" fill="#ffffff" font-size="12" font-weight="bold" letter-spacing="3">ACTIVE QUEST</text>
    <text x="410" y="288" fill="#3fb950" font-size="13">&#x25B8; Deploy ActivKlass Suite</text>
    <text x="410" y="312" fill="#8b949e" font-size="12">   &#x25CF;&#x25CF;&#x25CF;&#x25CF;&#x25CF;   cleared &#183; live on Vercel</text>
    <text x="410" y="340" fill="#c9d1d9" font-size="13">&#x25B8; Ship the Capstone</text>
    <text x="410" y="364" fill="#8b949e" font-size="12">   &#x25CF;&#x25CF;&#x25CF;&#x25CF;&#x25CB;   final revisions &amp; defense</text>

    <!-- ============ footer ============ -->
    <line x1="34" y1="386" x2="726" y2="386" stroke="#c9d1d9" stroke-width="1" opacity="0.25"/>
    <text x="34" y="416" fill="#8b949e" font-size="12">BUGS SLAIN 2,104</text>
    <text x="196" y="416" fill="#8b949e" font-size="12">BUGS CREATED 2,189</text>
    <text x="410" y="416" fill="#8b949e" font-size="12">NET CONTRIBUTION  ...still negative</text>
    <text x="726" y="416" fill="#d29922" font-size="13" text-anchor="end">&#x25BC;
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </text>

    <rect width="760" height="452" fill="url(#scan)"/>
  </g>
</svg>